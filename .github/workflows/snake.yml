name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: priyanshujoshi877

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00E5FF&color_dots=243B63,2563EB,3B82F6,60A5FA,22D3EE
            dist/github-contribution-grid-snake-dark.svg?color_snake=00E5FF&color_dots=243B63,2563EB,3B82F6,60A5FA,22D3EE
            dist/github-contribution-grid-snake.gif?color_snake=00E5FF&color_dots=243B63,2563EB,3B82F6,60A5FA,22D3EE&color_background=050A18

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
