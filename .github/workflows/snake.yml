name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: priyanshujoshi877

          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#12305A,#1D4ED8,#2563EB,#38BDF8,#7DD3FC
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#161B22,#0B3B82,#0066FF,#38BDF8,#7DD3FC
            dist/github-contribution-grid-snake.gif?color_snake=#00E5FF&color_dots=#161B22,#0B3B82,#0066FF,#38BDF8,#7DD3FC&color_background=#050A18

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
