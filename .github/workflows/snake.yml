name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Generate Electric Blue Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: priyanshujoshi877

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=38BDF8&color_dots=050A18,0B1F3A,0B3B82,0066FF,38BDF8
            dist/github-contribution-grid-snake-dark.svg?color_snake=00E5FF&color_dots=050A18,0B1F3A,0B3B82,0066FF,7DD3FC

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
